name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: pytest · Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Preparar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependencias comunes
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install fastapi "uvicorn[standard]" "pydantic>=2" httpx jsonschema

      - name: Instalar requirements.txt de cada grupo (si existen)
        run: |
          for req in grupo_*/requirements.txt; do
            if [ -f "$req" ]; then
              echo "Instalando $req"
              pip install -r "$req"
            fi
          done

      - name: Correr pytest de todos los grupos
        run: python -m pytest -v --tb=short

      - name: Correr pruebas de integración (si existen)
        if: always()
        run: |
          if [ -d "integration" ] && [ "$(ls -A integration 2>/dev/null | grep -E '\.py$' | grep -v __init__ || true)" ]; then
            echo "Ejecutando pruebas de integración"
            python -m pytest integration -v --tb=short
          else
            echo "No hay pruebas de integración todavía"
          fi
